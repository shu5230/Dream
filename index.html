<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小白爱折腾</title>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background:#f5f5f7; color:#1d1d1f; margin:0; padding:48px 16px; }
  .card { max-width:560px; margin:0 auto; background:#fff; border-radius:18px;
          padding:32px; box-shadow:0 4px 20px rgba(0,0,0,.08); text-align:center; }
  h1 { font-size:26px; margin:0 0 8px; }
  p { color:#6e6e73; line-height:1.6; }
  .url { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; background:#f0f0f3;
         padding:10px 14px; border-radius:10px; display:inline-block; word-break:break-all; }
  .btn { display:inline-block; margin:8px 6px 0; padding:12px 22px; border-radius:12px;
         background:#0071e3; color:#fff; text-decoration:none; font-weight:600; }
  .btn.ghost { background:#e8e8ed; color:#1d1d1f; }
  code { background:#f0f0f3; padding:2px 6px; border-radius:6px; }
</style>
</head>
<body>
  <div class="card">
    <h1>My Jailbreak Repo</h1>
    <p>个人 iOS 越狱插件源 Dopamine-roothide 隐根源</p>
    <p>源地址：</p>
    <div class="url" id="url">https://&lt;你的用户名&gt;.github.io/&lt;仓库名&gt;/</div>
    <p>
      <a class="btn" id="add-sileo" href="#">在 Sileo 中添加</a>
      <a class="btn ghost" href="#" id="copy">复制源地址</a>
    </p>
    <p style="font-size:13px">也可在 Sileo / Zebra / Cydia 手动添加上面的源地址。</p>
  </div>
  <script>
    // 自动把当前站点 URL 填进源地址与一键添加链接
    var base = location.origin + location.pathname.replace(/index\.html$/, "");
    if (base.endsWith("/")) base = base.slice(0, -1);
    document.getElementById("url").textContent = base + "/";
    document.getElementById("add-sileo").href = "sileo://source/" + base + "/";
    document.getElementById("copy").onclick = function(e){
      e.preventDefault();
      navigator.clipboard.writeText(base + "/").then(function(){
        alert("已复制源地址：" + base + "/");
      });
    };
  </script>
</body>
</html>
